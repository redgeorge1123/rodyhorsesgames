
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #100b07;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Particle background */
#particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
}

.particle {
    position: absolute;
    bottom: -20px;
    background: #ff7900;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff7900;
    animation: floatUp linear infinite;
    opacity: 0;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }
    15% {
        opacity: 0.9;
    }
    85% {
        opacity: 0.7;
    }
    100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
    }
}

/* Main content */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px;
}

.error {
    font-size: clamp(100px, 22vw, 220px);
    font-weight: 900;
    line-height: 1;
    color: #ff7900;
    text-shadow:
        0 0 15px #ff7900,
        0 0 35px #ff6600,
        0 0 75px rgba(255, 100, 0, 0.6);
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 15px #ff7900,
                     0 0 35px #ff6600;
    }
    to {
        text-shadow: 0 0 30px #ff7900,
                     0 0 70px #ff6600,
                     0 0 100px #ff4500;
    }
}

h2 {
    font-size: 30px;
    margin-top: 15px;
    letter-spacing: 2px;
}

p {
    color: #aaa;
    margin-top: 15px;
    font-size: 16px;
}

button {
    margin-top: 35px;
    padding: 15px 35px;
    border: 2px solid #ff7900;
    border-radius: 8px;
    background: #ff7900;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(255, 121, 0, 0.4);
}

button:hover {
    background: transparent;
    color: #ff7900;
    box-shadow: 0 0 30px #ff7900;
    transform: translateY(-3px);
}

.small-text {
    margin-top: 35px;
    font-size: 12px;
    color: #66513e;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div id="particles"></div>

<div class="container">
    <div class="error">404</div>

    <h2>PAGE NOT FOUND</h2>

    <p>
        Oops! The page you're looking for doesn't exist
        or may have been moved.
    </p>

    <button onclick="goHome()">← GO HOME</button>

    <div class="small-text">
        ERROR 404 • LOST IN SPACE
    </div>
</div>

<script>

// Create orange particles
const particleContainer = document.getElementById("particles");

for (let i = 0; i < 65; i++) {
    const particle = document.createElement("div");

    particle.className = "particle";

    const size = Math.random() * 6 + 2;

    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particle.style.left = Math.random() * 100 + "%";

    particle.style.animationDuration =
        (Math.random() * 10 + 5) + "s";

    particle.style.animationDelay =
        Math.random() * 10 + "s";

    particleContainer.appendChild(particle);
}

// Go to homepage
function goHome() {
    window.location.href = "/";
}

</script>

</body>
</html>
