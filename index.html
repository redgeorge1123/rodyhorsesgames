
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rody Horse Games</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* PARTICLE BACKGROUND */
#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

/* TOP BAR */
.topbar {
    position: absolute;
    top: 20px;
    right: 25px;
    z-index: 5;
}

.games-button {
    background: #ff8800;
    color: white;
    border: none;
    padding: 13px 27px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 9px;
    cursor: pointer;
    transition: 0.2s;
}

.games-button:hover {
    background: #ffab35;
    transform: scale(1.06);
}

/* MAIN TITLE */
.main {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.main h1 {
    color: #ff8800;
    font-size: clamp(35px, 7vw, 75px);
    text-shadow: 0 0 20px rgba(255,136,0,0.4);
}

/* GAMES POPUP */
.games-window {
    display: none;
    position: fixed;
    z-index: 10;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 1000px;
    height: 80vh;
    max-height: 750px;
    background: #1c1c24;
    border: 2px solid #ff8800;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 0 40px rgba(255,136,0,0.2);
    overflow-y: auto;
}

.games-window.active {
    display: block;
}

/* POPUP HEADER */
.window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.window-header h2 {
    color: #ff8800;
    font-size: 28px;
}

.close-button {
    background: #ff4444;
    color: white;
    border: none;
    width: 38px;
    height: 38px;
    font-size: 23px;
    border-radius: 8px;
    cursor: pointer;
}

.close-button:hover {
    background: #ff2222;
}

/* SEARCH BAR */
.search-bar {
    width: 100%;
    padding: 14px;
    background: #292933;
    border: 1px solid #444;
    border-radius: 9px;
    color: white;
    font-size: 16px;
    outline: none;
    margin-bottom: 25px;
}

.search-bar:focus {
    border-color: #ff8800;
}

/* GAME GRID */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
}

/* GAME CARDS */
.game-card {
    background: #292933;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.25s;
}

.game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 5px 20px rgba(255,136,0,0.25);
}

.game-card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    display: block;
}

.game-card h3 {
    text-align: center;
    padding: 13px;
    font-size: 16px;
}

.no-games {
    color: #aaa;
    text-align: center;
    grid-column: 1 / -1;
    padding: 30px;
}

/* DARK OVERLAY */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 8;
}

.overlay.active {
    display: block;
}

@media(max-width: 500px) {
    .games-window {
        width: 95%;
        padding: 15px;
    }

    .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .game-card img {
        height: 100px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<!-- TOP RIGHT BUTTON -->
<div class="topbar">
    <button class="games-button" onclick="openGames()">
        🎮 Games
    </button>
</div>

<!-- CENTER TITLE -->
<div class="main">
    <h1>Rody Horse Games</h1>
</div>

<!-- DARK OVERLAY -->
<div class="overlay" id="overlay" onclick="closeGames()"></div>

<!-- GAMES WINDOW -->
<div class="games-window" id="gamesWindow">

    <div class="window-header">
        <h2>🎮 Games</h2>
        <button class="close-button" onclick="closeGames()">×</button>
    </div>

    <input
        type="text"
        class="search-bar"
        id="searchInput"
        placeholder="🔍 Search for games..."
        oninput="searchGames()"
    >

    <div class="games-grid" id="gamesGrid"></div>

</div>

<script>

/* =================================
   ADD YOUR GAMES HERE!
   =================================

   Copy a game object and change:
   name  = Game name
   image = Image URL
   url   = Game website URL

   Add a comma between games!
*/

const games = [

    {
        name: "Slope",
        image: "https://rodyhorsegames.vercel.app/images/slope.png",
        url: "https://rodyhorsegames.vercel.app/games/slope/index.html"

];

/* DISPLAY GAMES */

function displayGames(list) {

    const grid = document.getElementById("gamesGrid");

    grid.innerHTML = "";

    if (list.length === 0) {
        grid.innerHTML = '<div class="no-games">No games found!</div>';
        return;
    }

    list.forEach(game => {

        const card = document.createElement("div");
        card.className = "game-card";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;
        img.loading = "lazy";

        const title = document.createElement("h3");
        title.textContent = game.name;

        card.appendChild(img);
        card.appendChild(title);

        card.onclick = () => {
            window.open(game.url, "_blank");
        };

        grid.appendChild(card);

    });
}

/* SEARCH GAMES */

function searchGames() {

    const search = document
        .getElementById("searchInput")
        .value.toLowerCase();

    const filtered = games.filter(game =>
        game.name.toLowerCase().includes(search)
    );

    displayGames(filtered);
}

/* OPEN WINDOW */

function openGames() {

    document.getElementById("gamesWindow")
        .classList.add("active");

    document.getElementById("overlay")
        .classList.add("active");

    displayGames(games);
}

/* CLOSE WINDOW */

function closeGames() {

    document.getElementById("gamesWindow")
        .classList.remove("active");

    document.getElementById("overlay")
        .classList.remove("active");

}

/* ESCAPE KEY CLOSES WINDOW */

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeGames();
    }
});

/* INITIALIZE */

displayGames(games);


/* =================================
   ANIMATED PARTICLE BACKGROUND
   ================================= */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    createParticles();
}

class Particle {

    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.speedY = (Math.random() - 0.5) * 0.6;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) {
            this.speedX *= -1;
        }

        if (this.y < 0 || this.y > canvas.height) {
            this.speedY *= -1;
        }
    }

    draw() {
        ctx.fillStyle = "#ff8800";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff8800";

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

function createParticles() {

    particles = [];

    let count = Math.min(
        120,
        Math.floor(canvas.width / 10)
    );

    for (let i = 0; i < count; i++) {
        particles.push(new Particle());
    }
}

function animateParticles() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        p.update();
        p.draw();
    });

    // CONNECT NEARBY PARTICLES
    for (let i = 0; i < particles.length; i++) {

        for (let j = i + 1; j < particles.length; j++) {

            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;

            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 120) {

                ctx.strokeStyle =
                    `rgba(255,136,0,${1 - distance / 120})`;

                ctx.lineWidth = 0.5;

                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();

            }
        }
    }

    requestAnimationFrame(animateParticles);
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
animateParticles();

</script>

</body>
</html>
