
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rody Horse Games</title>

<link id="favicon" rel="icon" href="">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.system-info {
    position: fixed;
    top: 20px;
    left: 25px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 18px;
    background: #1b1b24;
    border: 1px solid #ff8800;
    border-radius: 9px;
    padding: 12px 16px;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.system-info span {
    white-space: nowrap;
}

/* TOP BUTTONS */
.games-button,
.soundboard-button,
.cloak-button {
    position: fixed;
    top: 20px;
    z-index: 5;
    background: #ff8800;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.games-button {
    right: 25px;
}

.soundboard-button {
    right: 145px;
}

.cloak-button {
    right: 300px;
}

.games-button:hover,
.soundboard-button:hover,
.cloak-button:hover {
    background: #ffad32;
}

/* CENTER TITLE */
.main-title {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.main-title h1 {
    color: #ff8800;
    font-size: clamp(35px, 7vw, 75px);
    text-shadow: 0 0 20px #ff880055;
}

/* OVERLAY */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 9;
}

.overlay.show {
    display: block;
}

/* WINDOWS */
.games-window,
.soundboard-window,
.cloak-window {
    display: none;
    position: fixed;
    z-index: 10;
    width: 90%;
    max-width: 1000px;
    height: 80vh;
    max-height: 750px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1b1b24;
    border: 2px solid #ff8800;
    border-radius: 15px;
    padding: 22px;
    overflow-y: auto;
}

.games-window.show,
.soundboard-window.show,
.cloak-window.show {
    display: block;
}

/* CLOAK WINDOW */
.cloak-window {
    width: 90%;
    max-width: 500px;
    height: auto;
    max-height: 90vh;
}

.cloak-description {
    color: #aaa;
    margin-bottom: 22px;
    line-height: 1.5;
}

.cloak-label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: white;
}

.cloak-input {
    width: 100%;
    padding: 13px;
    margin-bottom: 20px;
    background: #292933;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.cloak-input:focus {
    border-color: #ff8800;
}

.cloak-preview {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #292933;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.cloak-preview img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    border-radius: 6px;
}

.cloak-preview-text {
    min-width: 0;
}

.cloak-preview-text strong {
    display: block;
    margin-bottom: 5px;
}

.cloak-preview-text span {
    color: #aaa;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.cloak-actions {
    display: flex;
    gap: 10px;
}

.apply-button,
.reset-button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.apply-button {
    background: #ff8800;
}

.apply-button:hover {
    background: #ffad32;
}

.reset-button {
    background: #444450;
}

.reset-button:hover {
    background: #5a5a68;
}

.cloak-message {
    color: #ffad32;
    font-size: 13px;
    margin-top: 15px;
}

/* SOUNDBOARD IFRAME */
.soundboard-window iframe {
    width: 100%;
    height: calc(100% - 65px);
    border: none;
    border-radius: 10px;
    background: white;
}

/* HEADER */
.window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.window-header h2 {
    color: #ff8800;
    font-size: 27px;
}

/* CLOSE BUTTON */
.close-button {
    background: #ff3838;
    color: white;
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 27px;
    cursor: pointer;
}

.close-button:hover {
    background: #d90000;
}

/* SEARCH BAR */
.search {
    width: 100%;
    padding: 14px;
    margin-bottom: 22px;
    background: #292933;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

.search:focus {
    border-color: #ff8800;
}

/* GAME GRID */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
}

.game-card {
    background: #292933;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 20px #ff880055;
}

.game-card img {
    width: 100%;
    height: 135px;
    object-fit: cover;
    display: block;
}

.game-card h3 {
    text-align: center;
    padding: 13px;
    font-size: 16px;
}

.no-games {
    text-align: center;
    color: #aaa;
    padding: 30px;
    grid-column: 1 / -1;
}

@media(max-width: 650px) {
    .games-window,
    .soundboard-window {
        width: 95%;
        height: 85vh;
        padding: 14px;
    }

    .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .game-card img {
        height: 100px;
    }

    .system-info {
        top: 10px;
        left: 10px;
        gap: 8px;
        padding: 10px;
        font-size: 11px;
    }

    .games-button {
        top: 65px;
        right: 10px;
        padding: 9px 12px;
        font-size: 13px;
    }

    .soundboard-button {
        top: 65px;
        right: 100px;
        padding: 9px 12px;
        font-size: 13px;
    }

    .cloak-button {
        top: 65px;
        right: 220px;
        padding: 9px 12px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<!-- BATTERY AND CLOCK -->
<div class="system-info">
    <span id="battery">🔋 Battery: Loading...</span>
    <span id="clock">🕒 Loading...</span>
</div>

<!-- GAMES BUTTON -->
<button class="games-button" onclick="openGames()">
    🎮 Games
</button>

<!-- SOUNDBOARD BUTTON -->
<button class="soundboard-button" onclick="openSoundBoard()">
    🎵 SoundBoard
</button>

<!-- CLOAK BUTTON -->
<button class="cloak-button" onclick="openCloak()">
    🥷 Cloak
</button>

<!-- MAIN TITLE -->
<div class="main-title">
    <h1>Rody Horse Games</h1>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeWindows()"></div>

<!-- GAMES WINDOW -->
<div class="games-window" id="gamesWindow">

    <div class="window-header">
        <h2>🎮 Games</h2>
        <button class="close-button" onclick="closeGames()">&times;</button>
    </div>

    <input
        class="search"
        id="searchInput"
        type="text"
        placeholder="🔍 Search games..."
        oninput="searchGames()"
    >

    <div class="games-grid" id="gamesGrid"></div>

</div>

<!-- SOUNDBOARD WINDOW -->
<div class="soundboard-window" id="soundboardWindow">

    <div class="window-header">
        <h2>🎵 SoundBoard</h2>
        <button class="close-button" onclick="closeSoundBoard()">&times;</button>
    </div>

    <iframe
        src="/soundboard.html"
        title="SoundBoard"
        allow="autoplay">
    </iframe>

</div>

<!-- CLOAK WINDOW -->
<div class="cloak-window" id="cloakWindow">

    <div class="window-header">
        <h2>🥷 Cloak Settings</h2>

        <button class="close-button" onclick="closeCloak()">
            &times;
        </button>
    </div>

    <p class="cloak-description">
        Customize how your website appears in the browser tab.
        Change the tab title and favicon to whatever you want.
    </p>

    <label class="cloak-label" for="cloakName">
        Website Tab Name
    </label>

    <input
        class="cloak-input"
        id="cloakName"
        type="text"
        placeholder="Enter any website name..."
    >

    <label class="cloak-label" for="cloakImage">
        Tab Image URL
    </label>

    <input
        class="cloak-input"
        id="cloakImage"
        type="url"
        placeholder="https://example.com/image.png"
    >

    <!-- PREVIEW -->
    <div class="cloak-preview">
        <img id="cloakPreviewImage" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23ff8800'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='25'%3E🌐%3C/text%3E%3C/svg%3E" alt="Preview">

        <div class="cloak-preview-text">
            <strong id="cloakPreviewName">Rody Horse Games</strong>
            <span>Browser tab preview</span>
        </div>
    </div>

    <div class="cloak-actions">
        <button class="apply-button" onclick="applyCloak()">
            ✓ Apply Changes
        </button>

        <button class="reset-button" onclick="resetCloak()">
            ↻ Reset
        </button>
    </div>

    <p class="cloak-message" id="cloakMessage"></p>

</div>

<script>

/* =====================================
   GAMES
   ===================================== */

const games = [

    {
        name: "Slope",
        image: "/images/slope.png",
        url: "/gamewindow/slope/index.html"
    },
    {
        name: "OvO",
        image: "/images/ovo.png",
        url: "/gamewindow/ovo/index.html"
    },
    {
        name: "OvO 2",
        image: "/images/ovo2.png",
        url: "/gamewindow/ovo2/index.html"
    },
    {
        name: "OvO 3 Dimention",
        image: "/images/ovo3.png",
        url: "/gamewindow/ovo3/index.html"
    },
    {
        name: "Minecraft",
        image: "/images/minecraft.png",
        url: "/gamewindow/minecraft/index.html"
    },
    {
        name: "Drift Boss",
        image: "/images/driftboss.png",
        url: "/gamewindow/driftboss/index.html"
    },
    {
        name: "2048",
        image: "/images/2048.png",
        url: "/gamewindow/2048/index.html"
    },
    {
        name: "Cookie Clicker",
        image: "/images/cookieclicker.png",
        url: "/gamewindow/cookieclicker/index.html"
    },
    {
        name: "Run 3",
        image: "/images/run3.png",
        url: "/gamewindow/run3/index.html"
    },
    {
        name: "Geometry Dash",
        image: "/images/gd.png",
        url: "/gamewindow/gd/index.html"
    },
    {
        name: "Geometry Dash Lite",
        image: "/images/gdlite.png",
        url: "/gamewindow/gdlite/index.html"
    },
    {
        name: "Slice It All",
        image: "/images/sliceitall.png",
        url: "/gamewindow/sliceitall/index.html"
    },
    {
        name: "Bendy And The Ink Machine",
        image: "/images/bendy.png",
        url: "/gamewindow/bendy/index.html"
    },
    {
        name: "Schoolboy Runaway",
        image: "/images/schoolboy.png",
        url: "/gamewindow/schoolboy/index.html"
    },

];


/* =====================================
   DISPLAY GAMES
   ===================================== */

function displayGames(gameList) {

    const grid = document.getElementById("gamesGrid");

    grid.innerHTML = "";

    if (gameList.length === 0) {
        grid.innerHTML =
            '<div class="no-games">No games found!</div>';
        return;
    }

    gameList.forEach(game => {

        const card = document.createElement("div");
        card.className = "game-card";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;

        const title = document.createElement("h3");
        title.textContent = game.name;

        card.appendChild(img);
        card.appendChild(title);

        card.addEventListener("click", () => {
            window.open(game.url, "_blank");
        });

        grid.appendChild(card);

    });

}


/* =====================================
   SEARCH GAMES
   ===================================== */

function searchGames() {

    const search = document
        .getElementById("searchInput")
        .value.toLowerCase();

    const filteredGames = games.filter(game =>
        game.name.toLowerCase().includes(search)
    );

    displayGames(filteredGames);

}


/* =====================================
   OPEN AND CLOSE WINDOWS
   ===================================== */

function openGames() {

    closeWindows();

    document.getElementById("gamesWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");

    document.getElementById("searchInput").value = "";

    displayGames(games);

}

function closeGames() {
    document.getElementById("gamesWindow").classList.remove("show");
}

function openSoundBoard() {

    closeWindows();

    document.getElementById("soundboardWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");

}

function closeSoundBoard() {
    document.getElementById("soundboardWindow").classList.remove("show");
}

function openCloak() {

    closeWindows();

    document.getElementById("cloakWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");

}

function closeCloak() {
    document.getElementById("cloakWindow").classList.remove("show");
}

function closeWindows() {

    closeGames();
    closeSoundBoard();
    closeCloak();

    document.getElementById("overlay").classList.remove("show");

}


/* =====================================
   CLOAK SYSTEM
   ===================================== */

const originalTitle = "Rody Horse Games";
const originalIcon = "images/favicon.png";

function updateCloakPreview() {

    const name = document.getElementById("cloakName").value;
    const image = document.getElementById("cloakImage").value;

    document.getElementById("cloakPreviewName").textContent =
        name.trim() || originalTitle;

    document.getElementById("cloakPreviewImage").src =
        image.trim() || originalIcon;

}

document.getElementById("cloakName").addEventListener(
    "input",
    updateCloakPreview
);

document.getElementById("cloakImage").addEventListener(
    "input",
    updateCloakPreview
);

function applyCloak() {

    const name = document.getElementById("cloakName").value.trim();
    const image = document.getElementById("cloakImage").value.trim();
    const message = document.getElementById("cloakMessage");

    if (!name && !image) {
        message.textContent = "Enter a tab name or image URL first!";
        return;
    }

    let validImage = "";

    if (image) {

        try {
            const parsedURL = new URL(image);

            if (!["http:", "https:"].includes(parsedURL.protocol)) {
                throw new Error("Invalid image URL");
            }

            validImage = parsedURL.href;

        } catch (error) {
            message.textContent = "Please enter a valid image URL!";
            return;
        }

    }

    // CHANGE TAB TITLE
    document.title = name || originalTitle;

    // CHANGE TAB ICON
    if (validImage) {

        let favicon = document.getElementById("favicon");

        favicon.href = validImage;

    }

    message.textContent = "✓ Cloak changes applied!";

}

function resetCloak() {

    // RESTORE ORIGINAL TITLE
    document.title = originalTitle;

    // RESTORE ORIGINAL ICON
    document.getElementById("favicon").href = originalIcon;

    // CLEAR INPUTS
    document.getElementById("cloakName").value = "";
    document.getElementById("cloakImage").value = "";

    // UPDATE PREVIEW
    updateCloakPreview();

    document.getElementById("cloakMessage").textContent =
        "✓ Original tab settings restored!";

}


/* =====================================
   ESCAPE KEY
   ===================================== */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeWindows();
    }

});


/* =====================================
   INITIALIZE GAMES
   ===================================== */

displayGames(games);


/* =====================================
   LIVE CLOCK
   ===================================== */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("clock").textContent =
        "🕒 " + time;

}

updateClock();

setInterval(updateClock, 1000);


/* =====================================
   COMPUTER BATTERY
   ===================================== */

async function updateBattery() {

    const batteryDisplay = document.getElementById("battery");

    if (!navigator.getBattery) {
        batteryDisplay.textContent = "🔋 Battery: N/A";
        return;
    }

    try {

        const battery = await navigator.getBattery();

        function showBattery() {

            const percentage = Math.round(battery.level * 100);

            let icon = "🔋";

            if (battery.charging) {
                icon = "⚡";
            } else if (percentage <= 20) {
                icon = "🪫";
            }

            batteryDisplay.textContent =
                icon + " " + percentage + "%" +
                (battery.charging ? " Charging" : "");

        }

        showBattery();

        battery.addEventListener("levelchange", showBattery);
        battery.addEventListener("chargingchange", showBattery);

    } catch (error) {

        batteryDisplay.textContent = "🔋 Battery: Unavailable";

    }

}

updateBattery();


/* =====================================
   PARTICLE BACKGROUND
   ===================================== */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    particles = [];

    for (let i = 0; i < 100; i++) {

        particles.push({

            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.7,
            speedY: (Math.random() - 0.5) * 0.7

        });

    }

}

function animateParticles() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) {
            p.speedX *= -1;
        }

        if (p.y < 0 || p.y > canvas.height) {
            p.speedY *= -1;
        }

        ctx.fillStyle = "#ff8800";

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        // CONNECT PARTICLES
        for (let j = i + 1; j < particles.length; j++) {

            const dx = p.x - particles[j].x;
            const dy = p.y - particles[j].y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 120) {

                ctx.strokeStyle =
                    `rgba(255,136,0,${1 - distance / 120})`;

                ctx.lineWidth = 0.5;

                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();

            }

        }

    });

    requestAnimationFrame(animateParticles);

}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
animateParticles();

</script>

</body>
</html>
