
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rody Horse Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

/* PARTICLE BACKGROUND */
#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* TOP RIGHT GAMES BUTTON */
.games-button {
    position: fixed;
    top: 20px;
    right: 25px;
    z-index: 5;
    background: #ff8800;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 13px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.games-button:hover {
    background: #ffad32;
}

/* CENTER TITLE */
.main-title {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.main-title h1 {
    color: #ff8800;
    font-size: clamp(35px, 7vw, 75px);
    text-shadow: 0 0 20px #ff880055;
}

/* DARK BACKGROUND OVERLAY */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 9;
}

.overlay.show {
    display: block;
}

/* GAMES POPUP WINDOW */
.games-window {
    display: none;
    position: fixed;
    z-index: 10;
    width: 90%;
    max-width: 1000px;
    height: 80vh;
    max-height: 750px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1b1b24;
    border: 2px solid #ff8800;
    border-radius: 15px;
    padding: 22px;
    overflow-y: auto;
}

.games-window.show {
    display: block;
}

/* HEADER */
.window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.window-header h2 {
    color: #ff8800;
    font-size: 27px;
}

/* X BUTTON */
.close-button {
    background: #ff3838;
    color: white;
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 27px;
    cursor: pointer;
}

.close-button:hover {
    background: #d90000;
}

/* SEARCH BAR */
.search {
    width: 100%;
    padding: 14px;
    margin-bottom: 22px;
    background: #292933;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

.search:focus {
    border-color: #ff8800;
}

/* GAME IMAGES GRID */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
}

/* GAME CARD */
.game-card {
    background: #292933;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 20px #ff880055;
}

.game-card img {
    width: 100%;
    height: 135px;
    object-fit: cover;
    display: block;
}

.game-card h3 {
    text-align: center;
    padding: 13px;
    font-size: 16px;
}

.no-games {
    text-align: center;
    color: #aaa;
    padding: 30px;
    grid-column: 1 / -1;
}

@media(max-width: 500px) {
    .games-window {
        width: 95%;
        height: 85vh;
        padding: 14px;
    }

    .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .game-card img {
        height: 100px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<!-- GAMES BUTTON -->
<button class="games-button" onclick="openGames()">
    🎮 Games
</button>

<!-- MAIN TITLE -->
<div class="main-title">
    <h1>Rody Horse Games</h1>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeGames()"></div>

<!-- GAMES WINDOW -->
<div class="games-window" id="gamesWindow">

    <div class="window-header">
        <h2>🎮 Games</h2>

        <!-- CLOSE X BUTTON -->
        <button class="close-button" onclick="closeGames()">
            &times;
        </button>
    </div>

    <!-- SEARCH BAR -->
    <input
        class="search"
        id="searchInput"
        type="text"
        placeholder="🔍 Search games..."
        oninput="searchGames()"
    >

    <!-- GAME IMAGES -->
    <div class="games-grid" id="gamesGrid"></div>

</div>

<script>

/* =====================================
   ADD GAMES HERE!
   =====================================

   Copy and paste another game below.

   name  = Game name
   image = Game thumbnail image URL
   url   = Game link

*/

const games = [

    {
        name: "Slope",
        image: "https://rodyhorsegames.vercel.app/images/slope.png",
        url: "https://rodyhorsegames.vercel.app/gamewindow/slope/index.html"
    },


];


/* SHOW GAMES */

function displayGames(gameList) {

    const grid = document.getElementById("gamesGrid");

    grid.innerHTML = "";

    if (gameList.length === 0) {
        grid.innerHTML =
            '<div class="no-games">No games found!</div>';
        return;
    }

    gameList.forEach(game => {

        const card = document.createElement("div");
        card.className = "game-card";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;

        const title = document.createElement("h3");
        title.textContent = game.name;

        card.appendChild(img);
        card.appendChild(title);

        card.addEventListener("click", () => {
            window.open(game.url, "_blank");
        });

        grid.appendChild(card);

    });
}


/* SEARCH GAMES */

function searchGames() {

    const search = document
        .getElementById("searchInput")
        .value.toLowerCase();

    const filteredGames = games.filter(game =>
        game.name.toLowerCase().includes(search)
    );

    displayGames(filteredGames);
}


/* OPEN GAMES WINDOW */

function openGames() {

    document.getElementById("gamesWindow")
        .classList.add("show");

    document.getElementById("overlay")
        .classList.add("show");

    document.getElementById("searchInput").value = "";

    displayGames(games);
}


/* CLOSE GAMES WINDOW */

function closeGames() {

    document.getElementById("gamesWindow")
        .classList.remove("show");

    document.getElementById("overlay")
        .classList.remove("show");

}


/* ESCAPE KEY CLOSES WINDOW */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeGames();
    }

});


/* INITIALIZE GAMES */

displayGames(games);


/* =====================================
   PARTICLE BACKGROUND
   ===================================== */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    particles = [];

    for (let i = 0; i < 100; i++) {

        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.7,
            speedY: (Math.random() - 0.5) * 0.7
        });

    }

}

function animateParticles() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) {
            p.speedX *= -1;
        }

        if (p.y < 0 || p.y > canvas.height) {
            p.speedY *= -1;
        }

        ctx.fillStyle = "#ff8800";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        // CONNECT PARTICLES
        for (let j = i + 1; j < particles.length; j++) {

            const dx = p.x - particles[j].x;
            const dy = p.y - particles[j].y;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 120) {

                ctx.strokeStyle =
                    `rgba(255,136,0,${1 - distance / 120})`;

                ctx.lineWidth = 0.5;

                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();

            }

        }

    });

    requestAnimationFrame(animateParticles);

}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
animateParticles();

</script>

</body>
</html>
