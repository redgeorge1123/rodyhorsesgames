
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rody Horse Games</title>
<link id="favicon" rel="icon" href="">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.system-info {
    position: fixed;
    top: 20px;
    left: 25px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 18px;
    background: #1b1b24;
    border: 1px solid #ff8800;
    border-radius: 9px;
    padding: 12px 16px;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.system-info span {
    white-space: nowrap;
}

/* TOP BUTTONS */
.games-button,
.soundboard-button,
.cloak-button,
.browser-button {
    position: fixed;
    top: 20px;
    z-index: 5;
    background: #ff8800;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 13px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.games-button { right: 25px; }
.soundboard-button { right: 145px; }
.cloak-button { right: 300px; }

.browser-button {
    top: 75px;
    right: 25px;
}

.games-button:hover,
.soundboard-button:hover,
.cloak-button:hover,
.browser-button:hover {
    background: #ffad32;
}

/* CENTER TITLE */
.main-title {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.main-title h1 {
    color: #ff8800;
    font-size: clamp(35px, 7vw, 75px);
    text-shadow: 0 0 20px #ff880055;
}

/* OVERLAY */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 9;
}

.overlay.show {
    display: block;
}

/* WINDOWS */
.games-window,
.soundboard-window,
.cloak-window,
.browser-window {
    display: none;
    position: fixed;
    z-index: 10;
    width: 90%;
    max-width: 1000px;
    height: 80vh;
    max-height: 750px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1b1b24;
    border: 2px solid #ff8800;
    border-radius: 15px;
    padding: 22px;
    overflow-y: auto;
}

.games-window.show,
.soundboard-window.show,
.cloak-window.show,
.browser-window.show {
    display: block;
}

/* CLOAK WINDOW */
.cloak-window {
    width: 90%;
    max-width: 500px;
    height: auto;
    max-height: 90vh;
}

.cloak-description {
    color: #aaa;
    margin-bottom: 22px;
    line-height: 1.5;
}

.cloak-label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: white;
}

.cloak-input {
    width: 100%;
    padding: 13px;
    margin-bottom: 20px;
    background: #292933;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.cloak-input:focus {
    border-color: #ff8800;
}

.cloak-preview {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #292933;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.cloak-preview img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    border-radius: 6px;
}

.cloak-preview-text {
    min-width: 0;
}

.cloak-preview-text strong {
    display: block;
    margin-bottom: 5px;
}

.cloak-preview-text span {
    color: #aaa;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.cloak-actions {
    display: flex;
    gap: 10px;
}

.apply-button,
.reset-button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.apply-button {
    background: #ff8800;
}

.apply-button:hover {
    background: #ffad32;
}

.reset-button {
    background: #444450;
}

.reset-button:hover {
    background: #5a5a68;
}

.cloak-message {
    color: #ffad32;
    font-size: 13px;
    margin-top: 15px;
}

/* SOUNDBOARD IFRAME */
.soundboard-window iframe {
    width: 100%;
    height: calc(100% - 65px);
    border: none;
    border-radius: 10px;
    background: white;
}

/* BROWSER */
.browser-window {
    max-width: 1100px;
}

.browser-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.browser-bar input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    background: #292933;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.browser-bar input:focus {
    border-color: #ff8800;
}

.browser-bar button {
    background: #ff8800;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-weight: bold;
    cursor: pointer;
}

.browser-bar button:hover {
    background: #ffad32;
}

.browser-window iframe {
    width: 100%;
    height: calc(100% - 115px);
    border: none;
    border-radius: 10px;
    background: white;
}

/* HEADER */
.window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.window-header h2 {
    color: #ff8800;
    font-size: 27px;
}

/* CLOSE BUTTON */
.close-button {
    background: #ff3838;
    color: white;
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 27px;
    cursor: pointer;
}

.close-button:hover {
    background: #d90000;
}

/* SEARCH BAR */
.search {
    width: 100%;
    padding: 14px;
    margin-bottom: 22px;
    background: #292933;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

.search:focus {
    border-color: #ff8800;
}

/* GAME GRID */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
}

.game-card {
    background: #292933;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 20px #ff880055;
}

.game-card img {
    width: 100%;
    height: 135px;
    object-fit: cover;
    display: block;
}

.game-card h3 {
    text-align: center;
    padding: 13px;
    font-size: 16px;
}

.no-games {
    text-align: center;
    color: #aaa;
    padding: 30px;
    grid-column: 1 / -1;
}

@media(max-width: 650px) {
    .games-window,
    .soundboard-window,
    .browser-window {
        width: 95%;
        height: 85vh;
        padding: 14px;
    }

    .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .game-card img {
        height: 100px;
    }

    .system-info {
        top: 10px;
        left: 10px;
        gap: 8px;
        padding: 10px;
        font-size: 11px;
    }

    .games-button {
        top: 65px;
        right: 10px;
        padding: 9px 12px;
        font-size: 13px;
    }

    .soundboard-button {
        top: 65px;
        right: 100px;
        padding: 9px 12px;
        font-size: 13px;
    }

    .cloak-button {
        top: 65px;
        right: 220px;
        padding: 9px 12px;
        font-size: 13px;
    }

    .browser-button {
        top: 110px;
        right: 10px;
        padding: 9px 12px;
        font-size: 13px;
    }
}

/* SMALL SCREEN BROWSER BAR */
@media(max-width: 400px) {
    .browser-bar {
        flex-wrap: wrap;
    }

    .browser-bar input {
        width: 100%;
        flex-basis: 100%;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<!-- BATTERY AND CLOCK -->
<div class="system-info">
    <span id="battery">🔋 Battery: Loading...</span>
    <span id="clock">🕒 Loading...</span>
</div>

<!-- TOP BUTTONS -->
<button class="games-button" onclick="openGames()">🎮 Games</button>
<button class="soundboard-button" onclick="openSoundBoard()">🎵 SoundBoard</button>
<button class="cloak-button" onclick="openCloak()">🥷 Cloak</button>
<button class="browser-button" onclick="openBrowser()">🌐 Browser</button>

<!-- MAIN TITLE -->
<div class="main-title">
    <h1>Rody Horse Games</h1>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeWindows()"></div>

<!-- GAMES WINDOW -->
<div class="games-window" id="gamesWindow">
    <div class="window-header">
        <h2>🎮 Games</h2>
        <button class="close-button" onclick="closeGames()">&times;</button>
    </div>

    <input class="search" id="searchInput" type="text"
        placeholder="🔍 Search games..." oninput="searchGames()">

    <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- SOUNDBOARD WINDOW -->
<div class="soundboard-window" id="soundboardWindow">
    <div class="window-header">
        <h2>🎵 SoundBoard</h2>
        <button class="close-button" onclick="closeSoundBoard()">&times;</button>
    </div>

    <iframe src="/soundboard.html" title="SoundBoard" allow="autoplay"></iframe>
</div>

<!-- CLOAK WINDOW -->
<div class="cloak-window" id="cloakWindow">
    <div class="window-header">
        <h2>🥷 Cloak Settings</h2>
        <button class="close-button" onclick="closeCloak()">&times;</button>
    </div>

    <p class="cloak-description">
        Customize how your website appears in the browser tab.
        Change the tab title and favicon to whatever you want.
    </p>

    <label class="cloak-label" for="cloakName">Website Tab Name</label>
    <input class="cloak-input" id="cloakName" type="text"
        placeholder="Enter any website name...">

    <label class="cloak-label" for="cloakImage">Tab Image URL</label>
    <input class="cloak-input" id="cloakImage" type="url"
        placeholder="https://example.com/image.png">

    <div class="cloak-preview">
        <img id="cloakPreviewImage"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23ff8800'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='25'%3E🌐%3C/text%3E%3C/svg%3E"
            alt="Preview">

        <div class="cloak-preview-text">
            <strong id="cloakPreviewName">Rody Horse Games</strong>
            <span>Browser tab preview</span>
        </div>
    </div>

    <div class="cloak-actions">
        <button class="apply-button" onclick="applyCloak()">✓ Apply Changes</button>
        <button class="reset-button" onclick="resetCloak()">↻ Reset</button>
    </div>

    <p class="cloak-message" id="cloakMessage"></p>
</div>

<!-- BROWSER WINDOW -->
<div class="browser-window" id="browserWindow">
    <div class="window-header">
        <h2>🌐 Browser</h2>
        <button class="close-button" onclick="closeBrowser()">&times;</button>
    </div>

    <div class="browser-bar">
        <input
            type="text"
            id="browserURL"
            placeholder="Enter a website address..."
            onkeydown="if(event.key === 'Enter') loadBrowser()">

        <button onclick="loadBrowser()">Go</button>
    </div>

    <iframe
        id="browserFrame"
        src="about:blank"
        title="Browser">
    </iframe>
</div>

<script>

/* GAMES */

const games = [
    {name:"Slope",image:"/images/slope.png",url:"/gamewindow/slope/"},
    {name:"OvO",image:"/images/ovo.png",url:"/gamewindow/ovo/"},
    {name:"OvO 2",image:"/images/ovo2.png",url:"/gamewindow/ovo2/"},
    {name:"OvO 3 Dimention",image:"/images/ovo3.png",url:"/gamewindow/ovo3/"},
    {name:"Minecraft",image:"/images/minecraft.png",url:"/gamewindow/minecraft/"},
    {name:"Drift Boss",image:"/images/driftboss.png",url:"/gamewindow/driftboss/"},
    {name:"2048",image:"/images/2048.png",url:"/gamewindow/2048/"},
    {name:"Cookie Clicker",image:"/images/cookieclicker.png",url:"/gamewindow/cookieclicker/"},
    {name:"Run 3",image:"/images/run3.png",url:"/gamewindow/run3/"},
    {name:"Geometry Dash",image:"/images/gd.png",url:"/gamewindow/gd/"},
    {name:"Geometry Dash Lite",image:"/images/gdlite.png",url:"/gamewindow/gdlite/"},
    {name:"Slice It All",image:"/images/sliceitall.png",url:"/gamewindow/sliceitall/"},
    {name:"Bendy And The Ink Machine",image:"/images/bendy.png",url:"/gamewindow/bendy/"},
    {name:"Schoolboy Runaway",image:"/images/schoolboy.png",url:"/gamewindow/schoolboy/"},
    {name:"Gorilla Tag",image:"/images/gtag.png",url:"/gamewindow/gtag/"},
    {name:"Death Run 3D",image:"/images/deathrun.png",url:"/gamewindow/deathrun3d/"},
    {name:"Five Nights At Freddys",image:"/images/fnaf/1.png",url:"/gamewindow/fnaf/"},
    {name:"Five Nights At Freddys 2",image:"/images/fnaf/2.png",url:"/gamewindow/fnaf2/"},
    {name:"Five Nights At Freddys 3",image:"/images/fnaf/3.png",url:"/gamewindow/fnaf3/"},
    {name:"Five Nights At Freddys 4",image:"/images/fnaf/4.png",url:"/gamewindow/fnaf4/"},
    {name:"Five Nights At Freddys SL",image:"/images/fnaf/sl.png",url:"/gamewindow/fnafsl/"},
    {name:"The Worlds Hardest Game",image:"/images/hardestgame/1.png",url:"/gamewindow/theworldshardestgame/"},
    {name:"The Worlds Hardest Game 3",image:"/images/hardestgame/3.png",url:"/gamewindow/theworldshardestgame3/"},
    {name:"The Worlds Hardest Game 4",image:"/images/hardestgame/4.png",url:"/gamewindow/theworldshardestgame4/"},
    {name:"Block Blast",image:"/images/blockblast.png",url:"/gamewindow/blockblast/"},
    {name:"Civilization II",image:"/images/civII.png",url:"/gamewindow/civII/"},
    {name:"Bloxorz",image:"/images/bloxorz.png",url:"/gamewindow/bloxorz/"},
    {name:"Amaze",image:"/images/amaze.png",url:"/gamewindow/amaze/"},
];


/* DISPLAY GAMES */

function displayGames(gameList) {
    const grid = document.getElementById("gamesGrid");
    grid.innerHTML = "";

    if (gameList.length === 0) {
        grid.innerHTML = '<div class="no-games">No games found!</div>';
        return;
    }

    gameList.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;

        const title = document.createElement("h3");
        title.textContent = game.name;

        card.appendChild(img);
        card.appendChild(title);

        card.addEventListener("click", () => {
            window.open(game.url, "_blank");
        });

        grid.appendChild(card);
    });
}

/* SEARCH GAMES */

function searchGames() {
    const search = document.getElementById("searchInput").value.toLowerCase();

    const filteredGames = games.filter(game =>
        game.name.toLowerCase().includes(search)
    );

    displayGames(filteredGames);
}

/* WINDOWS */

function openGames() {
    closeWindows();
    document.getElementById("gamesWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");
    document.getElementById("searchInput").value = "";
    displayGames(games);
}

function closeGames() {
    document.getElementById("gamesWindow").classList.remove("show");
}

function openSoundBoard() {
    closeWindows();
    document.getElementById("soundboardWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");
}

function closeSoundBoard() {
    document.getElementById("soundboardWindow").classList.remove("show");
}

function openCloak() {
    closeWindows();
    document.getElementById("cloakWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");
}

function closeCloak() {
    document.getElementById("cloakWindow").classList.remove("show");
}

/* BROWSER SYSTEM */

function openBrowser() {
    closeWindows();
    document.getElementById("browserWindow").classList.add("show");
    document.getElementById("overlay").classList.add("show");
}

function closeBrowser() {
    document.getElementById("browserWindow").classList.remove("show");
}

function loadBrowser() {
    let url = document.getElementById("browserURL").value.trim();

    if (!url) return;

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    try {
        const parsedURL = new URL(url);

        if (!["http:", "https:"].includes(parsedURL.protocol)) {
            return;
        }

        document.getElementById("browserFrame").src = parsedURL.href;
    } catch (error) {
        alert("Please enter a valid website address.");
    }
}

function closeWindows() {
    closeGames();
    closeSoundBoard();
    closeCloak();
    closeBrowser();
    document.getElementById("overlay").classList.remove("show");
}

/* CLOAK SYSTEM */

const originalTitle = "Rody Horse Games";
const originalIcon = "images/favicon.png";

function updateCloakPreview() {
    const name = document.getElementById("cloakName").value;
    const image = document.getElementById("cloakImage").value;

    document.getElementById("cloakPreviewName").textContent =
        name.trim() || originalTitle;

    document.getElementById("cloakPreviewImage").src =
        image.trim() || originalIcon;
}

document.getElementById("cloakName").addEventListener("input", updateCloakPreview);
document.getElementById("cloakImage").addEventListener("input", updateCloakPreview);

function applyCloak() {
    const name = document.getElementById("cloakName").value.trim();
    const image = document.getElementById("cloakImage").value.trim();
    const message = document.getElementById("cloakMessage");

    if (!name && !image) {
        message.textContent = "Enter a tab name or image URL first!";
        return;
    }

    let validImage = "";

    if (image) {
        try {
            const parsedURL = new URL(image);

            if (!["http:", "https:"].includes(parsedURL.protocol)) {
                throw new Error("Invalid image URL");
            }

            validImage = parsedURL.href;
        } catch (error) {
            message.textContent = "Please enter a valid image URL!";
            return;
        }
    }

    document.title = name || originalTitle;

    if (validImage) {
        document.getElementById("favicon").href = validImage;
    }

    message.textContent = "✓ Cloak changes applied!";
}

function resetCloak() {
    document.title = originalTitle;
    document.getElementById("favicon").href = originalIcon;
    document.getElementById("cloakName").value = "";
    document.getElementById("cloakImage").value = "";

    updateCloakPreview();

    document.getElementById("cloakMessage").textContent =
        "✓ Original tab settings restored!";
}

/* ESCAPE KEY */

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeWindows();
    }
});

/* INITIALIZE GAMES */

displayGames(games);

/* LIVE CLOCK */

function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("clock").textContent = "🕒 " + time;
}

updateClock();
setInterval(updateClock, 1000);

/* COMPUTER BATTERY */

async function updateBattery() {
    const batteryDisplay = document.getElementById("battery");

    if (!navigator.getBattery) {
        batteryDisplay.textContent = "🔋 Battery: N/A";
        return;
    }

    try {
        const battery = await navigator.getBattery();

        function showBattery() {
            const percentage = Math.round(battery.level * 100);

            let icon = "🔋";

            if (battery.charging) {
                icon = "⚡";
            } else if (percentage <= 20) {
                icon = "🪫";
            }

            batteryDisplay.textContent =
                icon + " " + percentage + "%" +
                (battery.charging ? " Charging" : "");
        }

        showBattery();

        battery.addEventListener("levelchange", showBattery);
        battery.addEventListener("chargingchange", showBattery);

    } catch (error) {
        batteryDisplay.textContent = "🔋 Battery: Unavailable";
    }
}

updateBattery();

/* PARTICLE BACKGROUND */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    particles = [];

    for (let i = 0; i < 100; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.7,
            speedY: (Math.random() - 0.5) * 0.7
        });
    }
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

        ctx.fillStyle = "#ff8800";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
            const dx = p.x - particles[j].x;
            const dy = p.y - particles[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 120) {
                ctx.strokeStyle = `rgba(255,136,0,${1 - distance / 120})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    });

    requestAnimationFrame(animateParticles);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
animateParticles();

</script>
</body>
</html>
